    <style>
        /* GALERÍA — crema sobre negro (theme-tinta), como Eventos. Filas
           justificadas: cada foto con su proporción, sin recortes, todas
           a ras con 6 px de aire; las filas ocupan el ancho exacto. Se ve
           una parte de la colección; el resto espera en reserva y, a ratos
           irregulares, una foto se funde en otra de la reserva con la misma
           proporción (y sin vecinas del mismo encuentro). Cada 40 s se baraja
           sola: las fotos se van y vuelven escalonadas. Clic: la foto entera. */

        header::after { display: none; }
        header { padding-top: clamp(40px, 5vw, 72px); padding-bottom: clamp(20px, 2.5vw, 32px); }
        footer { margin-top: clamp(40px, 5vw, 72px); padding-top: clamp(28px, 3vw, 40px); padding-bottom: clamp(28px, 3vw, 40px);
                 border-top: 1px solid var(--border); }

        /* ── Barajar: una etiqueta de texto en la línea del antetítulo, al
           margen derecho (como «Aleatorio» en el manifiesto). ─────────── */
        header { position: relative; }
        .shuffle-btn {
            position: absolute;
            top: clamp(40px, 5vw, 72px);           /* = padding-top del header */
            right: var(--gutter);
            padding: 0 0 1px;
            font: inherit;
            font-size: var(--fs-label);
            line-height: 1.6;                      /* = la del antetítulo */
            letter-spacing: var(--track);
            text-transform: uppercase;
            color: var(--muted);
            background: none;
            border: 0;
            border-bottom: 1px solid transparent;
            cursor: pointer;
            transition: color var(--ease), border-color var(--ease);
        }
        .shuffle-btn:hover,
        .shuffle-btn:focus-visible { color: var(--text); border-bottom-color: var(--text); }
        /* El antetítulo va en dos líneas; la primera sube hacia el margen
           superior, así la segunda —y el título— caen exactamente donde en
           Eventos y Manifiesto. «Barajar» se alinea con la segunda. */
        header .kicker { margin-top: -1.6em; padding-right: 104px; }

        /* ── Filas justificadas ────────────────────────────────────────────── */
        main { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
        .galeria { transition: opacity 0.8s cubic-bezier(0.45, 0, 0.25, 1); }
        .galeria.baraja { opacity: 0; }
        .fila { display: flex; gap: 6px; margin-bottom: 6px; }
        .foto {
            position: relative;
            display: block;
            min-width: 0;
            overflow: hidden;
            background: #0f0e0c;
            cursor: zoom-in;
        }
        .foto { transition: opacity 0.9s cubic-bezier(0.45, 0, 0.25, 1); }
        .foto.oculta { opacity: 0; }
        .foto picture { display: block; width: 100%; height: 100%; }
        /* La foto que llega se funde encima de la que se va: sin hueco. */
        .foto .capa {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .foto .capa.entra { opacity: 1; }
        .foto img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .foto .pie {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 36px 12px 10px;
            font-family: 'MinionPro', serif;
            font-size: 16px;
            line-height: 1.3;
            color: var(--crema);
            background: linear-gradient(transparent, rgba(15, 14, 12, 0.75));
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        .foto:hover .pie,
        .foto:focus-visible .pie { opacity: 1; }
        .foto:focus-visible { outline: 2px solid var(--crema); outline-offset: 2px; }

        /* ── Sin JS: columnas sencillas ────────────────────────────────────── */
        .gallery-static { columns: 3; column-gap: 6px; }
        .gallery-static figure { break-inside: avoid; margin: 0 0 6px; }
        .gallery-static figure img { width: 100%; height: auto; display: block; }
        .gallery-static figcaption { font-family: 'MinionPro', serif; font-size: 15px; color: var(--muted); padding: 6px 0 8px; }
        @media (max-width: 900px) { .gallery-static { columns: 2; } }

        /* ── El visor: la foto entera ──────────────────────────────────────── */
        .visor {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 0;
            border: 0;
            background: rgba(15, 14, 12, 0.97);
            color: var(--crema);
        }
        .visor[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
        .visor::backdrop { background: rgba(15, 14, 12, 0.97); }
        .visor-cab {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px var(--gutter);
            font-size: var(--fs-label);
            letter-spacing: var(--track);
            text-transform: uppercase;
            color: var(--muted);
        }
        .visor-cerrar {
            font: inherit;
            letter-spacing: inherit;
            text-transform: inherit;
            color: var(--crema);
            background: none;
            border: 0;
            border-bottom: 1px solid var(--crema);
            padding: 4px 0;
            cursor: pointer;
        }
        .visor-marco {
            position: relative;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(16px, 7vw, 120px);
        }
        .visor-marco img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.45s ease;
        }
        .visor-marco img.carga { opacity: 0; }
        .visor-prev,
        .visor-next {
            position: absolute;
            top: 0; bottom: 0;
            width: clamp(48px, 7vw, 120px);
            background: none;
            border: 0;
            color: var(--crema);
            font-size: 22px;
            opacity: 0.55;
            cursor: pointer;
            transition: opacity var(--ease);
        }
        .visor-prev { left: 0; }
        .visor-next { right: 0; }
        .visor-prev:hover, .visor-next:hover,
        .visor-prev:focus-visible, .visor-next:focus-visible { opacity: 1; }
        .visor-pie {
            padding: 16px var(--gutter) 24px;
            font-family: 'MinionPro', serif;
            font-size: 18px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .visor-prev, .visor-next { display: none; }   /* en el móvil, deslizar */
        }
    </style>
</head>

    var root = document.getElementById("galeria");
    var btn = document.getElementById("shuffle");
    var visor = document.getElementById("visor");
    if (!root) return;

    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var GAP = 6;

    function sm(src, ext) { return src.replace("gallery/", "gallery/sm/").replace(/\.jpg$/, ext || ".jpg"); }
    function ratio(i) { return IMAGES[i].w / IMAGES[i].h; }
    function barajar(a) {
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }
    var orden = IMAGES.map(function (_, i) { return i; });

    /* ── Filas justificadas ─────────────────────────────────────────────── */
    function altoObjetivo() {
        var w = window.innerWidth;
        return w < 560 ? 150 : w < 1000 ? 220 : 290;
    }

    function rellenar(a, i) {
        var im = IMAGES[i];
        a.dataset.i = i;
        a.href = im.src;
        a.setAttribute("aria-label", im.alt);
        a.querySelector("source").srcset = sm(im.src, ".webp");
        var img = a.querySelector("img");
        img.src = sm(im.src);
        img.alt = im.alt;
        a.querySelector(".pie").textContent = im.cap;
    }

    function pieza(i) {
        var a = document.createElement("a");
        a.className = "foto";
        var pic = document.createElement("picture");
        var src = document.createElement("source");
        src.type = "image/webp";
        var img = document.createElement("img");
        img.loading = "lazy";
        img.decoding = "async";
        pic.appendChild(src);
        pic.appendChild(img);
        var pie = document.createElement("span");
        pie.className = "pie";
        pie.setAttribute("aria-hidden", "true");
        a.appendChild(pic);
        a.appendChild(pie);
        rellenar(a, i);
        return a;
    }

    /* Reparte un orden en filas justificadas. Devuelve la geometría (sin
       tocar el DOM): sirve para pintar y para comprobar vecinos. */
    function repartir(ord, W, H) {
        var filas = [], fila = [], suma = 0;
        function cerrar(ultima) {
            var hueco = GAP * (fila.length - 1);
            var h = (W - hueco) / suma;
            if (ultima && h > H) h = H;          // la última fila no se estira
            var x = 0, celdas = [];
            fila.forEach(function (i) {
                var w = ratio(i) * h;
                celdas.push({ i: i, x0: x, x1: x + w });
                x += w + GAP;
            });
            filas.push({ h: h, ultima: ultima, celdas: celdas });
            fila = []; suma = 0;
        }
        ord.forEach(function (i) {
            fila.push(i);
            suma += ratio(i);
            if (suma * H + GAP * (fila.length - 1) >= W) cerrar(false);
        });
        if (fila.length) cerrar(true);
        return filas;
    }

    var SALIDA_OUT = 1200, SALIDA_IN = 1400, BARAJA_CADA = 40000;   // ms
    var reserva = [];          // fotos que no se ven ahora; entran poco a poco
    var VISIBLE = 0.6;         // fracción de la colección a la vista

    function componer(cascada) {
        var W = root.clientWidth;
        if (!W) return;
        var filas = repartir(orden, W, altoObjetivo());
        var meta = Math.ceil(IMAGES.length * VISIBLE), vistas = 0, k = 0;
        while (k < filas.length && vistas < meta) { vistas += filas[k].celdas.length; k++; }
        if (k === filas.length - 1 && filas[k].ultima) k++;   // no dejar una fila suelta
        var frag = document.createDocumentFragment();
        filas.slice(0, k).forEach(function (f) {
            var div = document.createElement("div");
            div.className = "fila";
            f.celdas.forEach(function (c) {
                var a = pieza(c.i);
                a.style.height = f.h.toFixed(2) + "px";
                if (f.ultima) a.style.width = (c.x1 - c.x0).toFixed(2) + "px";
                else a.style.flex = ratio(c.i) + " 1 0px"; // reparte el ancho exacto
                if (cascada) {
                    a.classList.add("oculta");
                    setTimeout(function () { a.classList.remove("oculta"); }, 80 + Math.random() * SALIDA_IN);
                }
                div.appendChild(a);
            });
            frag.appendChild(div);
        });
        reserva = [];
        filas.slice(k).forEach(function (f) { f.celdas.forEach(function (c) { reserva.push(c.i); }); });
        root.innerHTML = "";
        root.appendChild(frag);
    }

    /* ── Orden: nunca dos fotos del mismo encuentro juntas ──────────────────
       Ni una al lado de otra ni una encima de otra. Se construye el orden
       fila a fila evitando esos vecinos, se reparte de verdad en filas y se
       cuentan los choques (a los lados y en la fila de arriba, si se
       solapan). Se repite hasta dar con un reparto sin ninguno. */
    function evento(i) {
        var c = IMAGES[i].cap;
        return c.slice(c.lastIndexOf(" · ") + 3);
    }

    /* Construye las filas una a una: en cada hueco sólo entran fotos cuyo
       encuentro no sea el de su vecina de la izquierda ni el de alguna foto
       de la fila de arriba que quede encima (posición estimada a la altura
       objetivo). Entre las válidas, se prefiere el encuentro con más fotos
       pendientes, para no atascarse al final. */
    function secuencia(W, H) {
        var resto = barajar(IMAGES.map(function (_, i) { return i; }));
        var cuenta = {};
        resto.forEach(function (i) { cuenta[evento(i)] = (cuenta[evento(i)] || 0) + 1; });
        var sale = [], arriba = [];
        while (resto.length) {
            var fila = [], x = 0, suma = 0;
            while (resto.length) {
                var izq = fila.length ? evento(fila[fila.length - 1].i) : null;
                var libre = function (i) {
                    var e = evento(i), x1 = x + ratio(i) * H;
                    if (e === izq) return false;
                    return !arriba.some(function (d) { return d.e === e && d.x0 < x1 && x < d.x1; });
                };
                var ok = resto.filter(libre);
                if (!ok.length) ok = resto.filter(function (i) { return evento(i) !== izq; });
                if (!ok.length) ok = resto;
                var max = Math.max.apply(null, ok.map(function (i) { return cuenta[evento(i)]; }));
                var top = ok.filter(function (i) { return cuenta[evento(i)] >= max - 1; });
                var el = top[Math.floor(Math.random() * top.length)];
                resto.splice(resto.indexOf(el), 1);
                cuenta[evento(el)]--;
                fila.push({ i: el, x0: x, x1: x + ratio(el) * H, e: evento(el) });
                x += ratio(el) * H + GAP;
                suma += ratio(el);
                if (suma * H + GAP * (fila.length - 1) >= W) break;
            }
            // posiciones reales de la fila cerrada, para la siguiente
            var h = Math.min(H, (W - GAP * (fila.length - 1)) / suma), xx = 0;
            arriba = fila.map(function (c) {
                var w = ratio(c.i) * h, d = { e: c.e, x0: xx, x1: xx + w };
                xx += w + GAP;
                return d;
            });
            fila.forEach(function (c) { sale.push(c.i); });
        }
        return sale;
    }

    function choques(filas) {
        var n = 0;
        filas.forEach(function (f, k) {
            f.celdas.forEach(function (c, j) {
                if (j && evento(f.celdas[j - 1].i) === evento(c.i)) n++;
                if (k) filas[k - 1].celdas.forEach(function (d) {
                    if (d.x0 < c.x1 - 1 && c.x0 < d.x1 - 1 && evento(d.i) === evento(c.i)) n++;
                });
            });
        });
        return n;
    }

    function ordenar() {
        var W = root.clientWidth || 1200, H = altoObjetivo();
        var mejor = null, menos = Infinity;
        for (var t = 0; t < 400 && menos > 0; t++) {
            var o = secuencia(W, H);
            var n = choques(repartir(o, W, H));
            if (n < menos) { menos = n; mejor = o; }
        }
        return mejor;
    }

    /* ── Barajar: las fotos se van y vuelven una a una, escalonadas ──────── */
    /* Barajar: cada foto se va en su momento (escalonadas en ~1,2 s), y el
       orden nuevo vuelve igual, foto a foto (~1,4 s). Mientras dura, no hay
       relevos sueltos. También se baraja sola cada BARAJA_CADA. */
    var barajando = false;

    function rebarajar() {
        if (reduce) { orden = ordenar(); componer(false); return; }
        if (barajando) return;
        barajando = true;
        var fotos = root.querySelectorAll(".foto");
        Array.prototype.forEach.call(fotos, function (a) {
            setTimeout(function () { a.classList.add("oculta"); }, Math.random() * SALIDA_OUT);
        });
        setTimeout(function () {
            orden = ordenar();
            componer(true);
            setTimeout(function () { barajando = false; }, SALIDA_IN + 900);
        }, SALIDA_OUT + 900);
    }

    function barajaSola() {
        var encima = root.matches(":hover");
        if (!document.hidden && !(visor && visor.open) && !encima) rebarajar();
        setTimeout(barajaSola, BARAJA_CADA);
    }

    /* ── Relevo: a ratos, una foto se funde en otra de la reserva ─────────
       Sólo entra una foto de la misma proporción (±2 %: nada se recorta) y
       de un encuentro distinto al de sus vecinas (a los lados, encima y
       debajo). La foto bajo el ratón no cambia; tampoco con el visor abierto,
       la pestaña oculta o movimiento reducido. */
    var recientes = [];

    function vecinosEventos(a) {
        var r = a.getBoundingClientRect(), ev = [];
        var fila = a.parentNode, filas = Array.prototype.slice.call(root.children), k = filas.indexOf(fila);
        if (a.previousElementSibling) ev.push(evento(+a.previousElementSibling.dataset.i));
        if (a.nextElementSibling) ev.push(evento(+a.nextElementSibling.dataset.i));
        [filas[k - 1], filas[k + 1]].forEach(function (f) {
            if (!f) return;
            Array.prototype.forEach.call(f.children, function (b) {
                var q = b.getBoundingClientRect();
                if (q.left < r.right - 1 && r.left < q.right - 1) ev.push(evento(+b.dataset.i));
            });
        });
        return ev;
    }

    function relevo() {
        if (barajando || document.hidden || (visor && visor.open) || !reserva.length) return;
        var fotos = Array.prototype.filter.call(root.querySelectorAll(".foto"), function (a) {
            return !a.matches(":hover") && !a.querySelector(".capa") && recientes.indexOf(a) === -1;
        });
        barajar(fotos);
        for (var n = 0; n < fotos.length; n++) {
            var a = fotos[n], viejo = +a.dataset.i, rv = ratio(viejo);
            var prohibidos = vecinosEventos(a);
            var cand = reserva.filter(function (i) {
                return Math.abs(ratio(i) - rv) / rv < 0.02 && prohibidos.indexOf(evento(i)) === -1;
            });
            if (!cand.length) continue;
            var nuevo = cand[Math.floor(Math.random() * cand.length)];
            fundir(a, viejo, nuevo);
            return;
        }
    }

    function fundir(a, viejo, nuevo) {
        reserva.splice(reserva.indexOf(nuevo), 1);
        reserva.push(viejo);
        var pv = orden.indexOf(viejo), pn = orden.indexOf(nuevo);
        orden[pv] = nuevo; orden[pn] = viejo;

        recientes.push(a);
        if (recientes.length > 4) recientes.shift();

        var im = IMAGES[nuevo];
        var capa = document.createElement("picture");
        capa.className = "capa";
        var src = document.createElement("source");
        src.type = "image/webp";
        src.srcset = sm(im.src, ".webp");
        var img = document.createElement("img");
        img.alt = "";
        img.src = sm(im.src);
        capa.appendChild(src);
        capa.appendChild(img);
        a.insertBefore(capa, a.querySelector(".pie"));
        var listo = img.decode ? img.decode().catch(function () {}) : Promise.resolve();
        listo.then(function () {
            requestAnimationFrame(function () { capa.classList.add("entra"); });
            setTimeout(function () {
                // la capa pasa a ser la foto; la vieja se retira
                var vieja = a.querySelector("picture:not(.capa)");
                if (vieja) vieja.remove();
                capa.classList.remove("capa", "entra");
                a.dataset.i = nuevo;
                a.href = im.src;
                a.setAttribute("aria-label", im.alt);
                img.alt = im.alt;
                a.querySelector(".pie").textContent = im.cap;
            }, 1900);
        });
    }

    function latido() {
        relevo();
        setTimeout(latido, 1600 + Math.random() * 1600);   // ritmo irregular
    }

    /* ── El visor ───────────────────────────────────────────────────────── */
    if (visor && typeof visor.showModal === "function") {
        var vImg = visor.querySelector(".visor-marco img");
        var vPie = visor.querySelector(".visor-pie");
        var vCuenta = visor.querySelector(".visor-cuenta");
        var actual = 0;
        var pad = function (n) { return (n < 10 ? "0" : "") + n; };

        var mostrar = function (p) {
            actual = (p + orden.length) % orden.length;
            var im = IMAGES[orden[actual]];
            vImg.classList.add("carga");
            var pre = new Image();
            pre.onload = pre.onerror = function () {
                vImg.src = im.src;
                vImg.alt = im.alt;
                requestAnimationFrame(function () { vImg.classList.remove("carga"); });
            };
            pre.src = im.src;
            vPie.textContent = im.cap;
            vCuenta.textContent = pad(actual + 1) + " / " + pad(orden.length);
        };

        root.addEventListener("click", function (e) {
            var a = e.target.closest(".foto");
            if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
            e.preventDefault();
            mostrar(orden.indexOf(+a.dataset.i));
            visor.showModal();
        });
        visor.querySelector(".visor-prev").addEventListener("click", function () { mostrar(actual - 1); });
        visor.querySelector(".visor-next").addEventListener("click", function () { mostrar(actual + 1); });
        visor.querySelector(".visor-cerrar").addEventListener("click", function () { visor.close(); });
        visor.querySelector(".visor-marco").addEventListener("click", function (e) {
            if (e.target === this) visor.close();       // clic fuera de la foto
        });
        visor.addEventListener("keydown", function (e) {
            if (e.key === "ArrowLeft") { e.preventDefault(); mostrar(actual - 1); }
            if (e.key === "ArrowRight") { e.preventDefault(); mostrar(actual + 1); }
        });
        var x0 = null;
        visor.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
        visor.addEventListener("touchend", function (e) {
            if (x0 === null) return;
            var dx = e.changedTouches[0].clientX - x0;
            if (Math.abs(dx) > 50) mostrar(actual + (dx < 0 ? 1 : -1));
            x0 = null;
        });
    }

    /* ── Arranque ───────────────────────────────────────────────────────── */
    orden = ordenar();
    componer(!reduce);

    if (btn) {
        btn.hidden = false;
        btn.addEventListener("click", rebarajar);
    }

    if (!reduce) {
        setTimeout(latido, 2600);
        setTimeout(barajaSola, BARAJA_CADA);
    }

    var ultimoAncho = root.clientWidth, rt;
    window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () {
            if (root.clientWidth !== ultimoAncho) { ultimoAncho = root.clientWidth; orden = ordenar(); componer(false); }
        }, 150);
    });
})();
</script>

</body>
</html>
